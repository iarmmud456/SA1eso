<style>

/* ---------- Cálculo de resultados ---------- */
function progress() { var d = 0; ITEMS.forEach(function (it) { if (A(it.id).done) d++; }); return { done: d, total: ITEMS.length }; }
function critScores() {
  return CRIT_ORDER.map(function (code) {
    var its = ITEMS.filter(function (it) { return it.crit.indexOf(code) >= 0; });
    var done = its.filter(function (it) { return A(it.id).done; });
    var avg = done.reduce(function (s, it) { return s + A(it.id).score; }, 0) / its.length;
    return { code: code, items: its, nDone: done.length, score: avg };
  });
}
function overall() {
  var cs = critScores();
  return cs.reduce(function (s, c) { return s + c.score; }, 0) / cs.length;
}
function resultText(it) {
  var a = A(it.id);
  if (!a.done) return "Sin hacer";
  if (it.type === "likert") return "Autoevaluación: " + LIK[a.value];
  if (it.type === "text") return "Rúbrica " + a.found + "/" + it.rubric.length;
  if (a.status === "ok") return a.attempts === 1 ? "Acierto a la 1.ª" : "Acierto a la 2.ª";
  return "No resuelta";
}

/* ---------- Comprobación ---------- */
function toNum(v) { var n = parseFloat(String(v == null ? "" : v).trim().replace(",", ".")); return isNaN(n) ? null : n; }
function isEmpty(it, v) {
  if (it.type === "mcq" || it.type === "likert") return v === null || v === undefined;
  if (it.type === "table") return !v || v.length < it.answer.length || v.some(function (x) { return toNum(x) === null; });
  if (it.type === "slider") return false;
  if (it.type === "text") return !v || v.trim().length < 20;
  return toNum(v) === null;
}
function isRight(it, v) {
  if (it.type === "mcq") return v === it.answer;
  if (it.type === "num") return Math.abs(toNum(v) - it.answer) <= (it.tol || 0) + 1e-9;
  if (it.type === "table") return it.answer.every(function (x, i) { return toNum(v[i]) === x; });
  if (it.type === "slider") return v === it.answer;
  return false;
}
function submit(it) {
  var a = A(it.id);
  if (a.done) return;
  var v = a.value;
  if (it.type === "slider" && v == null) v = a.value = it.value0;
  if (isEmpty(it, v)) {
    a.msg = it.type === "text" ? "Escribe al menos 20 caracteres para poder evaluar tu explicación." : it.type === "table" ? "Rellena todas las casillas con números." : "Escribe o elige una respuesta antes de comprobar.";
    return;
  }
  a.msg = "";
  a.attempts++;
  if (it.type === "text") {
    var found = it.rubric.filter(function (r) { return r.re.test(v); });
    a.found = found.length; a.rub = it.rubric.map(function (r) { return r.re.test(v); });
    a.score = a.found / it.rubric.length * 10; a.done = true; a.status = a.found === it.rubric.length ? "ok" : "partial";
    return;
  }
  if (isRight(it, v)) { a.done = true; a.status = "ok"; a.score = a.attempts === 1 ? 10 : 6; }
  else if (a.attempts >= 2) { a.done = true; a.status = "fail"; a.score = 0; }
  else a.status = "retry";
}

    '<div class="sheet stack"><h3>Criterios de evaluación que se trabajan</h3><div class="chips">' + chips + '</div><p class="note">Procedentes de la programación didáctica del Departamento de Matemáticas 2026/2027 para 1º ESO. Cada actividad indica el criterio que evalúa y al final puedes descargar un informe en PDF.</p></div></main>';
  return s;
}

function stageHTML(i) {
  var st = STAGES[i];
  var s = stepsHTML() + "<main>";
  s += '<div class="sheet stack"><span class="eyebrow">Etapa ' + (i + 1) + " de 4 · " + st.sub + "</span><h2>" + st.title + '</h2><p class="lead">' + st.intro + "</p></div>";
  if (st.story) s += '<div class="sheet story stack"><h3>El enunciado</h3><p>' + st.story + "</p></div>";
  ITEMS.filter(function (it) { return it.stage === i; }).forEach(function (it) { s += cardHTML(it); });

    '<button class="btn primary" type="button" data-act="go" data-v="' + (i === 3 ? "report" : i + 1) + '">' + (i === 3 ? "Ver mis resultados" : "Siguiente etapa") + "</button></div></main>";
  return s;
}

function reportHTML() {
  var p = progress(), o = overall(), cs = critScores();
  var s = stepsHTML() + "<main>";
  s += '<div class="sheet stack"><span class="eyebrow">Resultados</span><h2>Informe de ' + esc(S.student.name) + "</h2><p class=\"lead\">" + esc(S.student.course) + " · " + new Date().toLocaleDateString("es-ES") + '</p>' +
    '<div class="kpis"><div class="kpi"><div class="v">' + (o === null ? "–" : fmt(o)) + '</div><div class="l">Nota media por criterios sobre 10' + (p.done < p.total ? " (lo no hecho cuenta 0)" : "") + "</div></div>" +
    '<div class="kpi"><div class="v">' + (o === null ? "–" : level(o)[0]) + '</div><div class="l">Nivel de logro</div></div>' +
    '<div class="kpi"><div class="v">' + p.done + " / " + p.total + '</div><div class="l">Actividades terminadas</div></div></div>' +
    '<div class="actions"><button class="btn primary" type="button" data-act="pdf">Descargar informe PDF</button><button class="btn" type="button" data-act="copy">Copiar resumen</button><button class="btn" type="button" data-act="nav">Volver a mi actividad</button></div><textarea class="say" id="sumtxt" readonly hidden aria-label="Resumen para copiar"></textarea>' +
    '<p class="note">La nota de cada criterio es la suma de las notas de sus actividades dividida entre todas las actividades de ese criterio (acierto a la primera 10, a la segunda 6, no resuelta 0). Las actividades sin hacer cuentan 0. La nota global es la media de los 17 criterios y los criterios sin hacer cuentan 0. La programación indica media ponderada: el profesorado aplicará los pesos del departamento.</p></div>';
  s += '<div class="sheet stack"><h3>Evaluación por criterio</h3><div class="crit-list">';

      '<span class="meter"><i class="' + (lv ? lv[2] : "") + '" style="width:' + (c.score === null ? 0 : c.score * 10) + '%"></i></span></div>';
  });
  s += "</div></div>";
  s += '<div class="sheet stack"><h3>Detalle de actividades</h3><div class="tscroll"><table><thead><tr><th>Actividad</th><th>Criterio</th><th>Resultado</th><th>Pistas</th><th>Nota</th></tr></thead><tbody>';
  ITEMS.forEach(function (it) {
    var a = A(it.id);
    s += "<tr><td>" + it.id + " · " + it.title + '</td><td class="m">' + it.crit.join(", ") + "</td><td>" + resultText(it) + '</td><td class="m">' + (a.hints || 0) + '</td><td class="m">' + (a.done ? fmt(a.score) : "–") + "</td></tr>";
  });
  s += "</tbody></table></div></div>";
  var e = A("E1");
  if (e.done) s += '<div class="sheet stack"><h3>Tu explicación escrita</h3><p>' + esc(e.value).replace(/\n/g, "<br>") + "</p></div>";
  s += '<div class="sheet stack"><h3>Empezar de nuevo</h3><p class="note">Borra tus respuestas de este navegador y vuelve a la pantalla de entrada.</p><div class="actions" id="reset-zone"><button class="btn ghost" type="button" data-act="reset1">Borrar mis respuestas</button></div></div></main>';
  return s;
}

function stageView() {
  if (/^[0-3]$/.test(S.prev || "")) return S.prev;
  for (var i = 0; i < STAGES.length; i++) { if (!ITEMS.every(function (it) { return it.stage !== i || A(it.id).done; })) return String(i); }
  return "0";
}
function goto(v) {
  if (/^[0-3]$/.test(S.view)) S.prev = S.view;
  S.view = v; save(); render();
  var c = S.last && BY_ID[S.last] && String(BY_ID[S.last].stage) === v ? $("card-" + S.last) : null;
  if (c) c.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0);
}
function render() {
  var top = $("top");
  if (!S.student) S.view = "login";
  top.hidden = !S.student;
  if (S.student) {
    $("who").innerHTML = "<b>" + esc(S.student.name) + "</b> · " + esc(S.student.course);
    $("btn-nav").textContent = /^[0-3]$/.test(S.view) ? "Mis resultados" : "Volver a mi actividad";
    updateProgress();
  }
  if (S.view === "login") { $("app").innerHTML = loginHTML(); bind(); return; }
  $("app").innerHTML = S.view === "report" ? reportHTML() : stageHTML(Number(S.view));
  ITEMS.forEach(function (it) { if (it.type === "slider" && S.view === String(it.stage)) fillGrid(it.id, A(it.id).value == null ? it.value0 : A(it.id).value); });
  bind();
}
function updateProgress() {
  var p = progress(), pc = Math.round(p.done / p.total * 100);
  $("pfill").style.width = pc + "%"; $("ppct").textContent = p.done + " / " + p.total;
  $("pbar").setAttribute("aria-valuenow", String(pc)); $("pbar").setAttribute("aria-valuetext", p.done + " de " + p.total + " actividades");
}
function refreshCard(id) {
  S.last = id;
  var el = $("card-" + id), it = BY_ID[id];
  el.outerHTML = cardHTML(it);
  if (it.type === "slider") fillGrid(id, A(id).value == null ? it.value0 : A(id).value);
  updateProgress(); refreshSteps(); save();
}
function refreshSteps() {
  var cur = document.querySelector(".steps"); if (!cur) return;
  var tmp = document.createElement("div"); tmp.innerHTML = stepsHTML(); cur.replaceWith(tmp.firstChild);
}
function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 3500); }

/* ---------- Eventos ---------- */
function bind() {
  var f = $("login");
  if (f) f.onsubmit = function (ev) {
    ev.preventDefault();
    var n = $("f-name").value.trim().replace(/\s+/g, " "), c = $("f-course").value.trim().replace(/\s+/g, " ");
    if (n.length < 3) { $("f-err").textContent = "Escribe tu nombre y apellidos."; $("f-name").focus(); return; }
    if (!c) { $("f-err").textContent = "Escribe tu curso."; $("f-course").focus(); return; }
    var changed = S.student && (S.student.name !== n || S.student.course !== c);
    if (changed && progress().done > 0 && !bind.ok) { bind.ok = true; $("f-err").textContent = "Cambiar de alumno borra las respuestas guardadas. Pulsa otra vez para confirmar."; return; }
    bind.ok = false;
    if (changed) { S.a = {}; S.prev = undefined; S.last = undefined; }
    S.student = { name: n, course: c }; goto(stageView());
  };
}
document.addEventListener("input", function (ev) {
  var el = ev.target, id = el.dataset && el.dataset.in; if (!id) return;
  var it = BY_ID[id], a = A(id);
  S.last = id;
  if (it.type === "mcq" || it.type === "likert") { a.value = Number(el.value); if (it.type === "likert") { var b = document.querySelector('[data-act="likert"][data-id="' + id + '"]'); if (b) b.disabled = false; } }
  else if (it.type === "slider") { a.value = Number(el.value); fillGrid(id, a.value); $("ro-" + id).textContent = "lado " + a.value + " m · " + a.value + " · " + a.value + " = " + a.value * a.value + " baldosas"; }
  else if (it.type === "table") { if (!a.value) a.value = []; a.value[Number(el.dataset.k)] = el.value; }
  else a.value = el.value;
  save();
});
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if (act === "go") goto(b.dataset.v);
  else if (act === "nav") goto(/^[0-3]$/.test(S.view) ? "report" : stageView());
  else if (act === "switch") goto("login");
  else if (act === "copy") copySummary();
  else if (act === "check") { submit(BY_ID[id]); refreshCard(id); }
  else if (act === "hint") { var a = A(id); if (!a.showHint) { a.showHint = true; a.hints = (a.hints || 0) + 1; } refreshCard(id); }
  else if (act === "likert") { var a2 = A(id); a2.done = true; a2.status = "ok"; a2.attempts = 1; a2.score = a2.value / 3 * 10; refreshCard(id); }
  else if (act === "retext") { var a3 = A(id); a3.done = false; refreshCard(id); }
  else if (act === "pdf") makePdf();
  else if (act === "reset1") { $("reset-zone").innerHTML = '<span class="err">¿Seguro? Se borrarán todas tus respuestas.</span><button class="btn primary" type="button" data-act="reset2">Sí, borrar</button><button class="btn" type="button" data-act="reset0">Cancelar</button>'; }
  else if (act === "reset0") render();
  else if (act === "reset2") { S = { student: null, view: "login", a: {} }; try { localStorage.removeItem(KEY); } catch (e) {} render(); window.scrollTo(0, 0); }
});

/* ---------- Informe PDF ---------- */
function safe(t) {
  return String(t).replace(/<sup>/g, "^").replace(/<\/sup>/g, "").replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "")
    .replace(/√/g, "raiz de ").replace(/≈/g, "~").replace(/→/g, "->").replace(/−/g, "-").replace(/✓/g, "[x]").replace(/✗/g, "[ ]").replace(/…/g, "...").replace(/«|»/g, '"').replace(/·/g, "x");
}
function slug(t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "alumno"; }
function loadJsPdf() {
  return new Promise(function (res) {
    if (window.jspdf) return res(true);
    var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = function () { res(!!window.jspdf); }; s.onerror = function () { res(false); };
    document.head.appendChild(s);
  });
}
function summaryText() {
  var p = progress(), o = overall(), t = ["El rumor y el patio - Matemáticas 1º ESO", S.student.name + " - " + S.student.course + " - " + new Date().toLocaleDateString("es-ES"), "Progreso: " + p.done + " de " + p.total + " actividades", "Nota media por criterios: " + (o === null ? "sin calificar" : fmt(o) + " / 10 (" + level(o)[0] + ")"), ""];
  critScores().forEach(function (c) { t.push(c.code + ": " + (c.score === null ? "sin hacer" : fmt(c.score) + " / 10")); });
  var e = A("E1"); if (e.done) t.push("", "Explicación escrita: " + e.value);
  return t.join("\n");
}
function copySummary() {
  var t = summaryText();
  var fail = function () { var ta = $("sumtxt"); if (ta) { ta.hidden = false; ta.value = t; ta.focus(); ta.select(); } toast("Copia el texto seleccionado."); };
  try { navigator.clipboard.writeText(t).then(function () { toast("Resumen copiado."); }, fail); } catch (e) { fail(); }
}
async function makePdf() {
  if (!S.student) { toast("Identifícate primero para generar tu informe."); return; }
  toast("Preparando el informe…");
  if (!(await loadJsPdf())) { toast("No se pudo cargar el generador de PDF. Comprueba tu conexión e inténtalo de nuevo."); return; }
  var dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({ unit: "mm", format: "a4" });
  var M = 16, W = 210, y = 0, p = progress(), o = overall(), cs = critScores();
  function need(h) { if (y + h > 282) { doc.addPage(); y = 18; } }
  function txt(t, x, size, bold, color) { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor.apply(doc, color || [21, 33, 92]); doc.text(safe(t), x, y); }
  function para(t, size, bold, color, width, lh) {
    doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor.apply(doc, color || [21, 33, 92]);
    var lines = doc.splitTextToSize(safe(t), width || (W - 2 * M)); var step = lh || size * 0.42;
    lines.forEach(function (l) { need(step); doc.text(l, M, y); y += step; });
  }
  doc.setFillColor(21, 33, 92); doc.rect(0, 0, W, 34, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.text("Informe de aprendizaje", M, 15);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); doc.text("Situación de aprendizaje: El rumor y el patio (potencias y raíces)", M, 22);
  doc.setFontSize(9); doc.text("Matemáticas 1º ESO - Departamento de Matemáticas 2026/2027 - I.E.S. Ntra. Sra. de la Cabeza, Andújar", M, 28.5);
  y = 46;
  txt("Alumno/a:", M, 11, true); txt(S.student.name, M + 26, 11, false); y += 7;
  txt("Curso:", M, 11, true); txt(S.student.course, M + 26, 11, false); y += 7;
  txt("Fecha:", M, 11, true); txt(new Date().toLocaleDateString("es-ES"), M + 26, 11, false); y += 7;
  txt("Progreso:", M, 11, true); txt(p.done + " de " + p.total + " actividades terminadas (" + Math.round(p.done / p.total * 100) + " %)", M + 26, 11, false); y += 10;
  doc.setDrawColor(21, 33, 92); doc.setLineWidth(0.6); doc.rect(M, y, W - 2 * M, 20);
  y += 8; txt(o === null ? "Sin calificación todavía" : "Nota media por criterios: " + fmt(o) + " / 10  (" + level(o)[0] + ")", M + 4, 14, true); y += 7;
  txt(p.done < p.total ? "Faltan actividades por terminar: las actividades y criterios sin hacer cuentan 0." : "Todas las actividades terminadas.", M + 4, 9.5, false, [79, 90, 134]); y += 13;

  txt("Evaluación por criterio", M, 13, true); y += 7;
  cs.forEach(function (c) {
    var lines = doc.splitTextToSize(safe(CRIT[c.code]), W - 2 * M); need(12 + lines.length * 3.6);
    txt(c.code, M, 10, true); txt(c.score === null ? "Sin hacer" : fmt(c.score) + " / 10 - " + level(c.score)[0], M + 32, 10, true, c.score === null ? [79, 90, 134] : c.score < 5 ? [201, 58, 38] : [23, 118, 78]);
    txt(c.nDone + " de " + c.items.length + " act.", W - M - 24, 9, false, [79, 90, 134]); y += 2;
    doc.setFillColor(220, 230, 244); doc.rect(M, y, 60, 2.4, "F");
    if (c.score !== null) { doc.setFillColor.apply(doc, c.score < 5 ? [201, 58, 38] : c.score < 7 ? [200, 140, 20] : [23, 118, 78]); doc.rect(M, y, 60 * c.score / 10, 2.4, "F"); }
    y += 6; doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(79, 90, 134);
    lines.forEach(function (l) { doc.text(l, M, y); y += 3.6; }); y += 3;
  });

  need(20); y += 2; txt("Detalle de actividades", M, 13, true); y += 7;
  function row(c, bold) {
    doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(8.5); doc.setTextColor(21, 33, 92);
    doc.text(safe(c[0]), M, y); doc.text(safe(c[1]), M + 68, y); doc.text(safe(c[2]), M + 92, y); doc.text(safe(c[3]), M + 142, y); doc.text(safe(c[4]), M + 157, y);
  }
  need(8); row(["Actividad", "Criterio", "Resultado", "Pistas", "Nota"], true); y += 2; doc.setDrawColor(150, 165, 200); doc.setLineWidth(0.2); doc.line(M, y, W - M, y); y += 4.5;
  ITEMS.forEach(function (it) {
    var a = A(it.id); need(6);
    row([it.id + " - " + it.title, it.crit.map(function (c) { return c.replace("MAT.", ""); }).join(", "), resultText(it).replace("Autoevaluación: ", "Autoeval.: "), String(a.hints || 0), a.done ? fmt(a.score) : "-"]); y += 5.2;
  });
  var e = A("E1");
  y += 4; need(24); txt("Explicación escrita por el alumno/a", M, 13, true); y += 6;
  if (e.done) {
    para(e.value, 10, false, null, null, 4.6); y += 2;
    para("Rúbrica automática: " + e.found + " de " + BY_ID.E1.rubric.length + " elementos (" + BY_ID.E1.rubric.map(function (r, i) { return (e.rub[i] ? "[x] " : "[ ] ") + r.label; }).join("; ") + ").", 8.5, false, [79, 90, 134]);
  } else para("No se ha entregado explicación.", 10, false, [79, 90, 134]);
  y += 5; need(30); txt("Autoevaluación del alumno/a", M, 13, true); y += 6;
  ["L1", "L2", "L3"].forEach(function (id) {
    var a = A(id); para(BY_ID[id].crit[0] + " - " + BY_ID[id].prompt + " Respuesta: " + (a.done ? LIK[a.value] : "sin responder"), 9.5, false, null, null, 4.3); y += 1.5;
  });
  y += 4; need(36);
  para("Notas para el profesorado: la nota de cada criterio es la suma de las notas de sus actividades dividida entre todas las actividades del criterio (acierto a la primera 10, a la segunda 6, no resuelta 0; las autoevaluaciones puntúan de 0 a 10 según la frecuencia indicada), de modo que las actividades sin hacer cuentan 0. La nota global es la media simple de los 17 criterios, y los criterios sin hacer cuentan 0; la programación didáctica establece media ponderada, por lo que deben aplicarse los pesos del departamento. Los criterios MAT.1.10.1 y MAT.1.10.2 (trabajo en equipo) no se evalúan en esta actividad individual.", 8.5, false, [79, 90, 134]);
  var n = doc.getNumberOfPages();
  for (var i = 1; i <= n; i++) { doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(120, 130, 160); doc.text("El rumor y el patio - " + safe(S.student.name) + " - " + S.student.course, M, 291); doc.text("Página " + i + " de " + n, W - M - 22, 291); }
  var buf = doc.output("arraybuffer"), name = "informe_potencias_raices_" + slug(S.student.name) + ".pdf";
  if (dl) {
    try { await dl.save({ filename: name, data: buf.slice(0) }); toast("Informe guardado."); return; }
    catch (err) { if (err && err.code === "declined") { toast("Descarga cancelada."); return; } }
  }
  try {
    var u = URL.createObjectURL(new Blob([buf], { type: "application/pdf" })), l = document.createElement("a");
    l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 8000);
    toast("Informe generado. Si no se descarga, abre la aplicación en el navegador o usa «Copiar resumen» en Resultados.");
  } catch (e2) { toast("No se pudo descargar aquí. Usa «Copiar resumen» en Resultados."); }
}

render();
if (/^[0-3]$/.test(S.view) && S.last && BY_ID[S.last] && BY_ID[S.last].stage === Number(S.view)) setTimeout(function () { var c = $("card-" + S.last); if (c) c.scrollIntoView({ block: "center" }); }, 80);
})();
</script>
